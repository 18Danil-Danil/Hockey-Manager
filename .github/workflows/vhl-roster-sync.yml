name: Синхронизация составов ВХЛ

on:
  push:
    branches:
      - refactoring
    paths:
      - 'tools/vhl-roster-sync.mjs'
      - 'tools/vhl-roster-smoke-test.mjs'
      - 'data/teams.js'
  workflow_dispatch:
    inputs:
      team:
        description: "Клуб для проверки (slug) или all для всей лиги"
        required: false
        default: "all"
        type: string
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: vhl-roster-sync
  cancel-in-progress: false

jobs:
  sync-rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Получить код проекта
        uses: actions/checkout@v4
        with:
          ref: refactoring

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Загрузить и проверить составы
        run: |
          TEAM="${{ github.event.inputs.team || 'all' }}"
          node tools/vhl-roster-sync.mjs --team "$TEAM"


      - name: Проверить связку импортёра и генератора составов
        run: node tools/vhl-roster-smoke-test.mjs

      - name: Обновить базу составов в ветке refactoring
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.team == 'all')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vhl-rosters.js
          if git diff --cached --quiet; then
            echo "Составы не изменились — новый коммит не требуется."
          else
            git commit -m "chore: update VHL rosters"
            git push origin HEAD:refactoring
          fi

      - name: Добавить отчёт в сводку запуска
        if: always()
        run: |
          if [ -f vhl-roster-sync-report.md ]; then
            cat vhl-roster-sync-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Отчёт не создан. Проверьте журнал шага загрузки." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Сохранить JSON и отчёт как артефакт
        if: always() && hashFiles('vhl-rosters.json', 'vhl-roster-sync-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vhl-rosters-${{ github.run_number }}
          path: |
            vhl-rosters.json
            vhl-roster-sync-report.md
          retention-days: 14
          if-no-files-found: warn
